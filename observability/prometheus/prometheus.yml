global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "monolith-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: "monolith-api"
          environment: "local"

  - job_name: "otel-collector"
    scrape_interval: 5s
    static_configs:
      - targets: ["otel-collector:8889", "otel-collector:8888"]
        labels:
          service: "otel-collector"

  - job_name: "postgres-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres"
