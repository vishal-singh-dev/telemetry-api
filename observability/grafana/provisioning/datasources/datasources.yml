apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-ds
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      httpMethod: POST

  - name: Tempo
    type: tempo
    uid: tempo-ds
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus-ds
      tracesToLogs:
        datasourceUid: loki-ds
        filterByTraceId: true
        filterBySpanId: true
        mapTagNamesEnabled: true
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    uid: loki-ds
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo-ds
          matcherRegex: "trace_id=([0-9a-fA-F]+)|TraceId=([0-9a-fA-F]+)"
          name: TraceID
          url: "$${__value.raw}"
